url: https://ropengov.github.io/rogtemplate/

template:
  package: rogtemplate
  opengraph:
    twitter:
      site: '@rOpenGov'

reference:
- title: Site setup helpers
  desc: >
    Configure the rOpenGov **pkgdown** template, build a site locally or
    deploy it with GitHub Actions.
- contents:
  - has_concept("site")

- title: Package asset helpers
  desc: >
    Create package logos and favicons, add an rOpenGov badge to a README
    or load the rOpenGov font.
- contents:
  - has_concept("assets")

- title: rOpenGov color palettes
  desc: >
    Generate sequential, gradient and qualitative palettes for plots.
- contents:
  - has_concept("palettes")

- title: About the package
  desc: Package overview, authors and project links.
- contents:
  - rogtemplate-package

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, packages, github, lightswitch]
  components:
    packages:
      text: "Packages"
      menu:
      - text: "eurostat"
        href: https://ropengov.github.io/eurostat/
      - text: "giscoR"
        href: https://ropengov.github.io/giscoR/
      - text: "pxweb"
        href: https://ropengov.github.io/pxweb/

articles:
- title: Dashboards
  desc: Explore rOpenGov package downloads and dashboard rendering.
  navbar: Dashboards
  contents:
  - articles/downloads

- title: Precomputed articles
  desc: >
    Articles used to check precomputed R Markdown and Quarto output.
  navbar: Precomputed
  contents:
  - starts_with("precompute")

- title: Menu examples
  desc: >
    Articles used to test dropdown menus in the article navbar.
  navbar: Menu bar
  contents:
  - starts_with("menu/")

- title: Quarto examples
  desc: >
    Check Quarto article rendering, cross-references, citations and shortcodes.
  navbar: Quarto
  contents:
  - test-quarto
  - test/quarto-features

- title: R Markdown feature tests
  desc: >
    Check code rendering, layouts, tables and HTML widgets in **pkgdown**.
    These articles are available from the articles index.
  contents:
  - test/rendering
  - test/code
  - test/bullets
  - test/short
  - test/long-toc
  - test/reactable
  - test/widgets
